  <main class="container basic-main">
    <p class="section-kicker">基础操作 · 页面</p><h1>刷新页面查看更新</h1>
    <p class="basic-intro">有些页面需要刷新后才能看到更新。这里用一条模拟消息练习。</p>
    <section class="basic-task"><h2>试试这样说</h2><p>打开扩展的「AI 编译生成」，复制并发送下面的需求：</p><blockquote>点击“准备更新”，然后刷新当前页面，查看消息的最新状态。</blockquote><p>工作流保存后，先点「重置练习」，再在「主工作台」手动启动。</p><details><summary>如何核对结果</summary><p>刷新前，消息显示“暂无新消息”；刷新后，应显示“已收到新消息”。</p></details></section>
    <section class="basic-panel"><h2>消息状态</h2><p>点击「准备更新」后，刷新页面才能看到新消息。</p><div class="basic-result" id="message-status" role="status" aria-live="polite">暂无新消息。</div><div class="basic-actions"><button class="basic-button" id="prepare-update" type="button">准备更新</button><button class="basic-button secondary" id="reset-update" type="button">重置练习</button></div><p id="update-hint" role="status"></p></section>
