  <main class="container basic-main">
    <p class="section-kicker">基础操作 · 输入</p><h1>输入后按 Tab</h1>
    <p class="basic-intro">有些表单要等你离开输入框，才会检查刚填写的内容。这个练习让你看看它是怎样工作的。</p>
    <section class="basic-task"><h2>试试这样说</h2><p>打开扩展的「AI 编译生成」，复制并发送下面的需求：</p><blockquote>在取书人输入框输入“小林”，然后按 Tab，让页面检查姓名。</blockquote><p>工作流保存后，先点「重置练习」，再在「主工作台」手动启动。</p><details><summary>如何核对结果</summary><p>输入框里显示“小林”，下方出现“姓名已确认：小林”。</p></details></section>
    <section class="basic-panel"><h2>填写取书人</h2><p>输入姓名后按键盘上的 Tab，离开输入框就会显示检查结果。</p><label class="basic-label" for="reader-name">取书人</label><input class="basic-input" id="reader-name" autocomplete="off" placeholder="请输入姓名"><div class="basic-result" id="name-result" role="status" aria-live="polite">尚未检查姓名。</div><div class="basic-actions"><button class="basic-button secondary" id="reset-name" type="button">重置练习</button></div></section>
