<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>邮箱、电话与图片提取练习 - 九头虫 RPA</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    .contact-lab{padding:36px 0 64px;line-height:1.8}.contact-lab h1{font-size:30px;line-height:1.4}.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.contact-card{padding:24px;border:1px solid #dfe7dd;background:#fff;border-radius:12px;overflow-wrap:anywhere}.contact-card h2{font-size:18px}.contact-pictures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px}.contact-pictures img{width:100%;height:220px;object-fit:contain;background:#fff;border-radius:12px}.contact-lab a{text-decoration:underline;text-underline-offset:3px}@media(max-width:700px){.contact-grid,.contact-pictures{grid-template-columns:1fr}.contact-lab h1{font-size:25px}}
  </style>
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="../../hub.html">采集练习场</a><a class="header-link" href="/tools/extract-tools.html" target="_blank" rel="noopener noreferrer">查看本课教程 ↗</a></div></header>
  <main class="container contact-lab">
    <h1>提取邮箱、电话与图片</h1>
    <p>打开扩展后，选择「邮箱提取」「电话提取」或「图片提取」。这里有 3 个邮箱、2 个带国际区号的练习电话和 2 张示例图片。</p>
    <p>以下均为虚构练习信息，不需要发送邮件或拨打电话。</p>
    <section class="contact-grid" aria-label="练习联系人">
      <article class="contact-card"><h2>读者服务</h2><p><a href="mailto:reader@example.com">reader@example.com</a></p><p><a href="tel:+12025550101">+1 202-555-0101</a></p></article>
      <article class="contact-card"><h2>书店支持</h2><p><a href="mailto:support@example.org">support@example.org</a></p><p><a href="tel:+12025550142">+1 202-555-0142</a></p></article>
      <article class="contact-card"><h2>订单咨询</h2><p><a href="mailto:orders@example.net">orders@example.net</a></p></article>
    </section>
    <section class="contact-pictures" aria-label="示例图片"><img src="../operations/media/garden.svg" alt="花园示例图"><img src="../operations/media/sea.svg" alt="海边示例图"></section>
  </main>
</body>
</html>
