<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>取书登记</title><link rel="stylesheet" href="./frame-actions.css"><script src="./actions.js" defer></script></head>
<body class="frame-content" data-scenario="form"><h1>取书登记</h1><p>请使用虚构信息填写，提交结果仅在本页面显示。</p><form id="pickup-form" class="frame-form"><div><label for="pickup-name">称呼</label><input id="pickup-name" name="name" placeholder="例如：小林" required></div><div><label for="pickup-method">取书方式</label><select id="pickup-method" name="method" required><option value="">请选择</option><option>门店自取</option><option>快递配送</option></select></div><div><label for="pickup-note">备注</label><input id="pickup-note" name="note" placeholder="请输入练习内容" required></div><button class="frame-button" type="submit">提交登记</button></form><section id="pickup-result" class="frame-result" aria-live="polite" hidden><h2>登记结果</h2><dl><dt>称呼</dt><dd class="result-name"></dd><dt>取书方式</dt><dd class="result-method"></dd><dt>备注</dt><dd class="result-note"></dd></dl></section></body></html>
