    <p class="section-kicker">基础操作 · 02</p><h1>输入后按回车搜索</h1><p class="basic-intro">让工作流在搜索框中输入文字，再按回车查看结果。</p>
    <section class="basic-task"><h2>试试这样说</h2><p>打开扩展的「AI 编译生成」，复制并发送下面的需求：</p><blockquote>在书名搜索框输入“城市”，然后按回车搜索。</blockquote><p>工作流保存后，先点「重置练习」，再在「主工作台」手动启动。</p><details><summary>如何核对结果</summary><p>搜索结果应显示《城市慢行》，价格 ¥45.00。</p></details></section>
    <section class="basic-panel"><h2>搜索书籍</h2><p>输入后按回车，或点击搜索按钮。书籍均为虚构。</p><form id="search-form"><label class="basic-label" for="keyword">书名搜索</label><input class="basic-input" id="keyword" name="keyword" type="search" placeholder="输入书名" autocomplete="off"><div class="basic-actions"><button class="basic-button" type="submit">搜索</button><button class="basic-button secondary" type="reset">重置练习</button></div></form><div class="basic-result" id="search-result" role="status" aria-live="polite" hidden></div></section>
