<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>填写并提交表单 - 采集练习场</title>
  <link rel="stylesheet" href="./operations.css">
  <script src="./form.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="../../hub.html"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span><span>采集练习场<small>九头虫 RPA</small></span></a><a class="header-link" href="../../../guide/first-task.html">返回帮助文档 ↗</a></div></header>
  <main class="container operation-main">
    <a class="operation-back" href="../../hub.html">← 返回练习场</a>
    <section class="operation-hero"><p class="operation-eyebrow">网页操作 · 表单练习</p><h1>填写并提交表单</h1><p>练习输入文字、选择选项和提交后核对内容。</p></section>
    <div class="operation-grid">
      <section class="operation-panel" aria-labelledby="form-title">
        <h2 id="form-title">模拟咨询表</h2>
        <div class="notice-inline">这是练习用的模拟表单，提交内容只显示在当前页面，不会发送给任何人。请使用虚构信息。</div>
        <form id="practice-form" class="operation-form">
          <div><label class="field-label" for="contact-name">称呼</label><input id="contact-name" name="name" type="text" placeholder="例如：小林" required></div>
          <div><label class="field-label" for="topic">咨询主题</label><select id="topic" name="topic" required><option value="">请选择</option><option>商品咨询</option><option>订单咨询</option><option>其他问题</option></select></div>
          <fieldset><legend>回复方式</legend><div class="choice-row"><label><input type="radio" name="reply" value="站内留言" required>站内留言</label><label><input type="radio" name="reply" value="电话回访">电话回访</label></div></fieldset>
          <fieldset><legend>其他要求</legend><div class="choice-row"><label><input type="checkbox" name="urgent" value="加急处理">加急处理</label></div></fieldset>
          <div><label class="field-label" for="message">咨询内容</label><textarea id="message" name="message" placeholder="请输入练习内容" required></textarea></div>
          <div class="operation-actions"><button class="operation-button" type="submit">提交咨询</button><button class="operation-button secondary" type="reset">重置表单</button></div>
        </form>
        <div class="operation-result" id="submit-result" role="status" aria-live="polite" hidden><h3>模拟提交成功</h3><dl class="result-list" id="submit-details"></dl></div>
      </section>
      <aside class="operation-tip"><h2>试着这样做</h2><p>在扩展的「AI 编译生成」中发送：</p><blockquote>在当前表单中，称呼填小林，咨询主题选择订单咨询，回复方式选择站内留言，勾选加急处理，咨询内容填写“希望了解订单进度”，然后点击提交咨询。</blockquote><p>工作流保存后，先点击「重置表单」，再启动工作流。运行后，在提交结果中核对每一项。</p></aside>
    </div>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><span>采集练习场</span><span>模拟数据 · 用于练习</span></div></footer>
</body>
</html>
